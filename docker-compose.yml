services:

  # --------------------------------------------------
  # Traefik Reverse Proxy
  # --------------------------------------------------
  traefik:
    image: traefik:v3.6

    container_name: devops-traefik

    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    restart: unless-stopped


  # --------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------
  postgres:
    image: postgres:16-alpine

    container_name: devops-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devopsdb

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devopsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # --------------------------------------------------
  # S3-Compatible Object Storage
  # --------------------------------------------------
  localstack:
    image: localstack/localstack:3.8

    container_name: devops-localstack

    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1

    ports:
      - "4566:4566"

    volumes:
      - localstack_data:/var/lib/localstack

    restart: unless-stopped


  # --------------------------------------------------
  # Backend API
  # --------------------------------------------------
  backend:
    image: devops-backend:latest

    container_name: devops-backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: devopsdb

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1

      S3_ENDPOINT_URL: http://localstack:4566
      S3_PUBLIC_ENDPOINT_URL: http://localhost:4566
      S3_BUCKET_NAME: devops-files

      CORS_ORIGINS: http://app.debyez.localhost

    depends_on:
      postgres:
        condition: service_healthy

      localstack:
        condition: service_started

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.debyez.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # --------------------------------------------------
  # Frontend
  # --------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://api.debyez.localhost/api

    container_name: devops-frontend

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`app.debyez.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=80"

    depends_on:
      backend:
        condition: service_healthy

      traefik:
        condition: service_started

    restart: unless-stopped


# --------------------------------------------------
# Persistent Volumes
# --------------------------------------------------
volumes:

  postgres_data:

  localstack_data: